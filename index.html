<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현동초등학교 급식</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f4f0;
    --bg-tertiary: #eeedea;
    --text-primary: #1a1a18;
    --text-secondary: #6b6b67;
    --text-tertiary: #a0a09c;
    --border: rgba(0,0,0,0.12);
    --border-md: rgba(0,0,0,0.2);
    --radius-md: 8px;
    --radius-lg: 12px;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
    --danger-border: rgba(163,45,45,0.25);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1e1e1c;
      --bg-secondary: #2a2a28;
      --bg-tertiary: #333331;
      --text-primary: #f0efea;
      --text-secondary: #9a9a96;
      --text-tertiary: #6a6a66;
      --border: rgba(255,255,255,0.1);
      --border-md: rgba(255,255,255,0.2);
      --danger-bg: #2d1a1a;
      --danger-text: #f09595;
      --danger-border: rgba(240,149,149,0.2);
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg-secondary);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 1.5rem 1rem;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }

  .school-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 1.75rem;
    background: var(--bg-primary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
  }

  .school-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--radius-md);
    background: var(--bg-secondary);
    border: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  .school-name { font-size: 18px; font-weight: 600; color: var(--text-primary); }
  .school-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

  .top-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .date-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }

  .date-nav button, .view-toggle button, .week-tab {
    background: var(--bg-primary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-primary);
    font-family: inherit;
    transition: background 0.15s;
  }

  .date-nav button:hover, .view-toggle button:hover:not(.active), .week-tab:hover:not(.active) {
    background: var(--bg-tertiary);
  }

  .date-nav .nav-btn { padding: 7px 10px; }
  .date-display {
    flex: 1;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .view-toggle {
    display: flex;
    gap: 3px;
    background: var(--bg-primary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 3px;
    flex-shrink: 0;
  }

  .view-toggle button {
    border: none;
    background: transparent;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .view-toggle button.active {
    background: var(--bg-secondary);
    color: var(--text-primary);
    border: 0.5px solid var(--border);
  }

  .week-tabs {
    display: none;
    gap: 4px;
    margin-bottom: 1rem;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .week-tabs::-webkit-scrollbar { display: none; }
  .week-tabs.visible { display: flex; }

  .week-tab {
    flex-shrink: 0;
    font-size: 12px;
    padding: 5px 12px;
    color: var(--text-secondary);
  }

  .week-tab.active {
    background: var(--text-primary);
    color: var(--bg-primary);
    border-color: var(--text-primary);
  }

  .meal-card {
    background: var(--bg-primary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.25rem;
    margin-bottom: 0.75rem;
  }

  .meal-type {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .meal-items { display: flex; flex-direction: column; }

  .meal-item {
    font-size: 15px;
    color: var(--text-primary);
    padding: 5px 0;
    border-bottom: 0.5px solid var(--border);
    line-height: 1.4;
  }

  .meal-item:last-child { border-bottom: none; }

  .allergy-info {
    font-size: 10px;
    color: var(--text-tertiary);
    margin-left: 4px;
  }

  .cal-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-secondary);
    border: 0.5px solid var(--border);
    border-radius: 99px;
    padding: 3px 10px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 10px;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    background: var(--bg-primary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    color: var(--text-secondary);
  }

  .empty-state i {
    font-size: 36px;
    color: var(--text-tertiary);
    display: block;
    margin-bottom: 12px;
  }

  .empty-state .em-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 5px;
  }

  .loading-row {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 2rem;
    color: var(--text-secondary);
    font-size: 14px;
    justify-content: center;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border-md);
    border-top-color: var(--text-secondary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    background: var(--danger-bg);
    border: 0.5px solid var(--danger-border);
    border-radius: var(--radius-md);
    padding: 0.85rem 1rem;
    font-size: 13px;
    color: var(--danger-text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .api-notice {
    font-size: 11px;
    color: var(--text-tertiary);
    text-align: center;
    margin-top: 1.5rem;
    padding-bottom: 1rem;
  }

  .api-notice a { color: var(--text-secondary); text-decoration: none; }
  .api-notice a:hover { text-decoration: underline; }

  @media (max-width: 420px) {
    body { padding: 1rem 0.75rem; }
    .school-name { font-size: 16px; }
    .date-display { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="school-header">
    <div class="school-icon"><i class="ti ti-school"></i></div>
    <div>
      <div class="school-name">현동초등학교</div>
      <div class="school-sub">경상남도 창원시 · 초등학교</div>
    </div>
  </div>

  <div class="top-bar">
    <div class="date-nav">
      <button class="nav-btn" onclick="changeDate(-1)" aria-label="이전"><i class="ti ti-chevron-left"></i></button>
      <div class="date-display" id="dateDisplay"></div>
      <button class="nav-btn" onclick="changeDate(1)" aria-label="다음"><i class="ti ti-chevron-right"></i></button>
      <button onclick="goToday()">오늘</button>
    </div>
    <div class="view-toggle">
      <button id="btnDay" class="active" onclick="setView('day')">일간</button>
      <button id="btnWeek" onclick="setView('week')">주간</button>
    </div>
  </div>

  <div class="week-tabs" id="weekTabs"></div>
  <div id="mealContainer"></div>

  <div class="api-notice">
    나이스 교육정보 개방 포털 데이터 제공 ·
    <a href="https://open.neis.go.kr" target="_blank" rel="noopener">open.neis.go.kr</a>
  </div>
</div>

<script>
const API_KEY = 'caec08521bf5421e8e86ebbc6a4a7d8c';
const ATPT = 'J10';
const SCHUL_CODE = '7380292';
const MEAL_TYPES = {
  '1': { label: '조식', icon: 'ti-sun' },
  '2': { label: '중식', icon: 'ti-coffee' },
  '3': { label: '석식', icon: 'ti-moon' }
};
const DAYS = ['일','월','화','수','목','금','토'];

let currentDate = new Date();
let viewMode = 'day';
let cache = {};
let weekDatesRef = [];

function fmtDate(d) {
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}

function fmtDisplay(d) {
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`;
}

function fmtShort(d) {
  const today = fmtDate(new Date()) === fmtDate(d);
  return `${d.getMonth()+1}/${d.getDate()} (${DAYS[d.getDay()]})${today ? ' ●' : ''}`;
}

function getMon(d) {
  const dd = new Date(d);
  const day = dd.getDay();
  dd.setDate(dd.getDate() - (day === 0 ? 6 : day - 1));
  return dd;
}

function changeDate(delta) {
  if (viewMode === 'day') {
    currentDate.setDate(currentDate.getDate() + delta);
  } else {
    currentDate.setDate(currentDate.getDate() + delta * 7);
  }
  render();
}

function goToday() {
  currentDate = new Date();
  render();
}

function setView(v) {
  viewMode = v;
  document.getElementById('btnDay').classList.toggle('active', v === 'day');
  document.getElementById('btnWeek').classList.toggle('active', v === 'week');
  document.getElementById('weekTabs').classList.toggle('visible', v === 'week');
  render();
}

async function fetchMeal(dateStr) {
  if (cache[dateStr] !== undefined) return cache[dateStr];
  const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${ATPT}&SD_SCHUL_CODE=${SCHUL_CODE}&MLSV_YMD=${dateStr}`;
  try {
    const res = await fetch(url);
    const json = await res.json();
    const rows = json?.mealServiceDietInfo?.[1]?.row || [];
    cache[dateStr] = rows;
    return rows;
  } catch(e) {
    cache[dateStr] = null;
    return null;
  }
}

function parseDish(ddishNm) {
  return ddishNm.split('<br/>').map(item => {
    const clean = item.replace(/\s*\([\d.]+\)/g, '').trim();
    const allergyMatch = item.match(/\(([\d.]+)\)/g);
    return { name: clean, allergy: allergyMatch ? allergyMatch.join('') : '' };
  }).filter(d => d.name);
}

function renderMeals(rows, container) {
  if (rows === null) {
    container.innerHTML = `<div class="error-box"><i class="ti ti-alert-circle"></i> 급식 정보를 가져오는 중 오류가 발생했습니다.</div>`;
    return;
  }
  if (rows.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="ti ti-bowl-chopsticks"></i>
        <div class="em-title">급식 정보 없음</div>
        <div>이 날은 급식이 없거나 정보가 등록되지 않았습니다.</div>
      </div>`;
    return;
  }
  container.innerHTML = rows.map(row => {
    const mt = MEAL_TYPES[row.MMEAL_SC_CODE] || { label: '기타', icon: 'ti-utensils' };
    const dishes = parseDish(row.DDISH_NM);
    const cal = row.CAL_INFO ? row.CAL_INFO.trim() : null;
    return `
      <div class="meal-card">
        <div class="meal-type"><i class="ti ${mt.icon}"></i>${mt.label}</div>
        <div class="meal-items">
          ${dishes.map(d => `<div class="meal-item">${d.name}<span class="allergy-info">${d.allergy}</span></div>`).join('')}
        </div>
        ${cal ? `<div class="cal-badge"><i class="ti ti-flame" style="font-size:12px;"></i>${cal}</div>` : ''}
      </div>`;
  }).join('');
}

function selectWeekDay(btn, idx) {
  document.querySelectorAll('.week-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const d = weekDatesRef[idx];
  const rows = cache[fmtDate(d)];
  renderMeals(rows, document.getElementById('mealContainer'));
}

async function render() {
  const container = document.getElementById('mealContainer');
  const weekTabsEl = document.getElementById('weekTabs');

  if (viewMode === 'day') {
    document.getElementById('dateDisplay').textContent = fmtDisplay(currentDate);
    container.innerHTML = '<div class="loading-row"><div class="spinner"></div> 급식 정보를 불러오는 중...</div>';
    const rows = await fetchMeal(fmtDate(currentDate));
    renderMeals(rows, container);
  } else {
    const mon = getMon(currentDate);
    const weekDates = Array.from({length: 5}, (_, i) => {
      const d = new Date(mon);
      d.setDate(d.getDate() + i);
      return d;
    });
    weekDatesRef = weekDates;

    document.getElementById('dateDisplay').textContent = `${mon.getMonth()+1}월 ${mon.getDate()}일 주`;
    weekTabsEl.innerHTML = weekDates.map((d, i) =>
      `<button class="week-tab ${i === 0 ? 'active' : ''}" onclick="selectWeekDay(this, ${i})">${fmtShort(d)}</button>`
    ).join('');

    container.innerHTML = '<div class="loading-row"><div class="spinner"></div> 주간 급식 정보를 불러오는 중...</div>';
    await Promise.all(weekDates.map(d => fetchMeal(fmtDate(d))));

    const rows = cache[fmtDate(weekDates[0])];
    renderMeals(rows, container);
  }
}

render();
</script>
</body>
</html>
